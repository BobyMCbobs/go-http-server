---
stages:
  - codequality
  - test
  - build
  - pages

include:
  template: Dependency-Scanning.gitlab-ci.yml

variables:
  APP_BUILD_VERSION: 0.0.0
  APP_BUILD_MODE: development
  IMAGE_GOLANG_ALPINE: docker.io/golang:1.25.3-alpine3.22@sha256:aee43c3ccbf24fdffb7295693b6e33b21e01baec1b2a55acc351fde345e9ec34
  IMAGE_GOLANGCI_LINT: docker.io/golangci/golangci-lint:v2.5.0@sha256:0c8e590120a98ada5d0d9423e65dd957067e70c87efd692e83d5a311ddfc3151
  IMAGE_PYTHON: docker.io/python:3.13-alpine3.22@sha256:b4d299311845147e7e47c970566906caf8378a1f04e5d3de65b5f2e834f8e3bf
  COSIGN_YES: "true"

.image-set-build-env: &image-set-build-env |
  echo "Commit made on '${CI_COMMIT_TIMESTAMP}'"
  export APP_BUILD_HASH="$CI_COMMIT_SHORT_SHA"
  export APP_BUILD_DATE="$(git show -s --format=%cd --date=format:'%Y.%m.%d.%H%M')"
  export APP_BUILD_VERSION=0.0.0
  export APP_BUILD_MODE=development
  export IMAGE_DESTINATIONS="latest"
  if [[ ! -z "$CI_COMMIT_TAG" ]]; then
    export APP_BUILD_VERSION="$CI_COMMIT_TAG"
    export APP_BUILD_MODE=production
    export IMAGE_DESTINATIONS="$APP_BUILD_VERSION"
  fi

.setup-testing-repo: &setup-testing-repo |
  echo 'https://dl-cdn.alpinelinux.org/alpine/edge/testing' | tee -a /etc/apk/repositories

.setup-community-repo: &setup-community-repo |
  echo 'https://dl-cdn.alpinelinux.org/alpine/edge/community' | tee -a /etc/apk/repositories

build-container:
  only:
    - main
    - tags
  stage: build
  image:
    name: $IMAGE_GOLANG_ALPINE
    entrypoint: [""]
  retry: 2
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: "sigstore"
  variables:
    KO_DOCKER_REPO: "$CI_REGISTRY_IMAGE"
  before_script:
    - set -x
    - *setup-testing-repo
    - apk add --no-cache curl cosign ko git
    - export KO_DOCKER_REPO="$(echo ${KO_DOCKER_REPO} | tr '[:upper:]' '[:lower:]')"
    - ko login "${CI_REGISTRY}" -u "${CI_REGISTRY_USER}" -p "${CI_REGISTRY_PASSWORD}"
    - *image-set-build-env
  script:
    - ./hack/publish.sh --sign

build-backend-smoketest:
  stage: codequality
  only:
    - merge_requests
  image: $IMAGE_GOLANG_ALPINE
  before_script:
    - apk add --no-cache git
  script:
    - ./hack/verify-build-smoketest.sh

spellcheck:
  stage: codequality
  only:
    - merge_requests
  image:
    name: $IMAGE_GOLANG_ALPINE
    entrypoint: [""]
  allow_failure: true
  before_script:
    - apk add --no-cache git
  script:
    - ./hack/verify-spellcheck.sh

lint-backend:
  stage: codequality
  only:
    - merge_requests
  image:
    name: $IMAGE_GOLANG_ALPINE
    entrypoint: [""]
  allow_failure: true
  before_script:
    - apk add --no-cache git
  script:
    - ./hack/verify-lint-backend.sh

gotest:
  stage: codequality
  image: $IMAGE_GOLANG_ALPINE
  only:
    - merge_requests
  before_script:
    - apk add --no-cache git
  script:
    - ./hack/verify-gotest.sh

govet:
  stage: codequality
  image: $IMAGE_GOLANG_ALPINE
  only:
    - merge_requests
  before_script:
    - apk add --no-cache git
  script:
    - ./hack/verify-govet.sh

gofmt:
  stage: codequality
  image: $IMAGE_GOLANG_ALPINE
  only:
    - merge_requests
  before_script:
    - apk add --no-cache git
  script:
    - ./hack/verify-gofmt.sh

goimports:
  stage: codequality
  image: $IMAGE_GOLANG_ALPINE
  only:
    - merge_requests
  before_script:
    - apk add --no-cache git
  script:
    - ./hack/verify-goimports.sh

golangci-lint:
  stage: codequality
  only:
    - merge_requests
  image:
    name: $IMAGE_GOLANGCI_LINT
    entrypoint: [""]
  script:
    - ./hack/verify-golangci-lint.sh

govulncheck:
  stage: codequality
  only:
    - merge_requests
  image: $IMAGE_GOLANG_ALPINE
  before_script:
    - apk add --no-cache git
  script:
    - ./hack/verify-govulncheck.sh

pages-smoketest:
  image: $IMAGE_PYTHON
  stage: codequality
  only:
    - merge_requests
  script:
    - ./hack/build-docs.sh

conform:
  stage: codequality
  only:
    - merge_requests
  image:
    name: docker.io/library/alpine:3.18
    entrypoint: [""]
  before_script:
    - apk add --no-cache curl git
    - git fetch origin
    - |
      curl -sSL \
        -o /usr/local/bin/conform \
        https://github.com/siderolabs/conform/releases/download/v0.1.0-alpha.27/conform-linux-amd64
    - chmod +x /usr/local/bin/conform
  script:
    - conform enforce --commit-ref=refs/remotes/origin/main

pages:
  image: $IMAGE_PYTHON
  stage: pages
  script:
    - ./hack/build-docs.sh
  artifacts:
    paths:
      - public
  only:
    - main
